name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-gateway:
    name: Test Gateway (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        working-directory: ./gateway
        run: bun install
        
      - name: Generate Prisma Client
        working-directory: ./gateway
        run: bunx prisma generate
        
      - name: Run tests
        working-directory: ./gateway
        run: bun test

  test-worker:
    name: Test Worker (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: uv sync
        
      - name: Run tests
        run: PYTHONPATH=. uv run pytest worker/tests/
