[project]
name = "auraflow-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "bullmq>=3.0.4",
    "fastapi>=0.141.1",
    "langchain-anthropic>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-redis>=0.5.2",
    "python-dotenv>=1.2.2",
    "redis>=7.4.1",
    "uvicorn>=0.52.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "pytest-mock>=3.14.0",
]
